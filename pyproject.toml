[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Production-grade Retrieval-Augmented Generation pipeline with document ingestion and semantic search"
requires-python = ">=3.10"
authors = [
    {name = "RAG Team", email = "team@example.com"},
]
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langchain>=0.0.300",
    "langchain-community>=0.0.1",
    "sentence-transformers>=2.2",
    "chromadb>=0.3",
    "qdrant-client>=1.0",
    "PyPDF2>=3.0",
    "pdfplumber>=0.10",
    "python-docx>=0.8",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "kaggle>=1.5",
    "python-multipart>=0.0.5",
    "httpx>=0.20",
    "tenacity>=8.2",
    "tqdm>=4.60",
    "click>=8.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.11.0",
    "ruff==0.1.8",
    "mypy==1.7.0",
    "pre-commit==3.5.0",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
